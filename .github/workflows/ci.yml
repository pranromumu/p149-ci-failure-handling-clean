name: CI Failure Handling

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest and Generate Report
        # This step will fail because test_failure.py is designed to crash
        run: pytest -v --html=artifacts/reports/pytest_report.html --self-contained-html

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        # THE MAGIC TRICK: Run this step even if pytest failed!
        if: always()
        with:
          name: ci-failure-evidence
          path: artifacts/